<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sayt statistikasi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    main { padding-top: 32px; padding-bottom: 48px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .top-bar h1 { font-size: 28px; margin: 0; }
    .range { display: flex; gap: 6px; }
    .range button { border: 1px solid var(--border); background: var(--panel); padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; color: var(--muted); }
    .range button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .bars div { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 4px 10px; align-items: center; margin-bottom: 10px; font-size: 14px; }
    .bars i { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden; }
    .bars em { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
    .bars b { text-align: right; }
    .bars .empty { color: var(--muted); font-size: 14px; }
    .leads td a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .leads td.msg { white-space: normal; text-align: left; max-width: 360px; color: var(--muted); }
    .leads td, .leads th { text-align: left; }
    @media (max-width: 760px) { .three { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <main>
    <div class="top-bar">
      <h1>Sayt statistikasi</h1>
      <div class="range" id="range">
        <button data-d="7">7 kun</button><button data-d="30" class="on">30 kun</button><button data-d="90">90 kun</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="card"><h3>Kunlik tashrifchilar</h3><div class="chart-box"><canvas id="daily"></canvas></div></div>
    <div class="three">
      <div class="card"><h3>Qayerdan kelishdi</h3><div class="bars" id="refs"></div></div>
      <div class="card"><h3>Ochilgan loyihalar</h3><div class="bars" id="projects"></div></div>
      <div class="card"><h3>Qurilma va til</h3><div class="bars" id="devices"></div><div class="bars" id="langs"></div></div>
    </div>
    <div class="card leads">
      <h3>Saytdan kelgan arizalar</h3>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Sana</th><th>Ism</th><th>Telefon</th><th>Email</th><th>Xabar</th></tr></thead><tbody id="leads"></tbody></table></div>
    </div>
    <p class="muted small">IP manzillar saqlanmaydi. Tashrifchi har kuni yangi anonim kod bilan sanaladi. Botlar hisobga olinmaydi.</p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const num = (n) => Math.round(n || 0).toLocaleString("ru-RU").replace(/[\s,]/g, " ");
    const NAMES = { xpremium: "xPremium", alicase: "Ali CASE", quiz: "Quiz bot", tsue: "TSUE bot", darsreja: "DarsReja", slayd: "Slayd",
                    mobile: "Telefon", desktop: "Kompyuter", uz: "O'zbekcha", ru: "Ruscha", en: "Inglizcha" };
    let chart;

    function bars(el, list) {
      const max = Math.max(1, ...list.map((x) => x[1]));
      el.innerHTML = list.length ? list.map(([k, v]) => `<div><span>${esc(NAMES[k] || k)}</span><b>${num(v)}</b><i><em style="width:${100 * v / max}%"></em></i></div>`).join("")
        : `<p class="empty">Hali ma'lumot yo'q</p>`;
    }

    async function load(days) {
      const r = await fetch(`/admin/api/stats?days=${days}`, { cache: "no-store" });
      const s = await r.json();
      $("#kpis").innerHTML = [
        ["Bugun tashrifchilar", s.today.visitors, `${num(s.today.views)} ta sahifa ko'rish`],
        [`${days} kunda tashrifchilar`, s.period.visitors, `${num(s.period.views)} ta sahifa ko'rish`],
        ["Ochilgan loyihalar", s.projects.reduce((a, x) => a + x[1], 0), "loyiha oynasi ochilgan"],
        ["Arizalar", s.leads.length, "bog'lanish formasi orqali"],
      ].map(([l, v, sub]) => `<div class="kpi"><span>${l}</span><b>${num(v)}</b><small>${sub}</small></div>`).join("");
      const css = getComputedStyle(document.documentElement);
      const data = {
        labels: s.daily.map((d) => d.day.slice(8, 10) + "." + d.day.slice(5, 7)),
        datasets: [
          { label: "Tashrifchilar", data: s.daily.map((d) => d.visitors), backgroundColor: css.getPropertyValue("--accent").trim(), borderRadius: 4 },
          { label: "Sahifa ko'rish", data: s.daily.map((d) => d.views), backgroundColor: "#c7d7fb", borderRadius: 4 },
        ],
      };
      if (chart) { chart.data = data; chart.update(); }
      else chart = new Chart($("#daily"), { type: "bar", data, options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "bottom" } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0 } } } } });
      bars($("#refs"), s.refs);
      bars($("#projects"), s.projects);
      bars($("#devices"), s.devices);
      bars($("#langs"), s.langs);
      $("#leads").innerHTML = s.leads.length ? s.leads.map((l) => `<tr><td>${l.id}</td><td>${esc(l.created.slice(0, 16).replace("T", " "))}</td>
        <td>${esc(l.name)}</td><td><a href="tel:${esc(l.phone.replace(/[^\d+]/g, ""))}">${esc(l.phone)}</a></td>
        <td>${l.email ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : ""}</td><td class="msg">${esc(l.message)}</td></tr>`).join("")
        : `<tr><td colspan="6" class="muted">Hali ariza yo'q</td></tr>`;
    }

    $("#range").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      document.querySelectorAll("#range button").forEach((x) => x.classList.toggle("on", x === b));
      load(+b.dataset.d);
    });
    load(30);
  </script>
</body>
</html>
